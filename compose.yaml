services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ordertaker
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER outside the repository}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?Set POSTGRES_PASS outside the repository}
    volumes:
      - ordertaker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ordertaker"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      POSTGRES_URL: jdbc:postgresql://database:5432/ordertaker
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER outside the repository}
      POSTGRES_PASS: ${POSTGRES_PASS:?Set POSTGRES_PASS outside the repository}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET outside the repository}
      JWT_EXPIRATION_MILLISECONDS: ${JWT_EXPIRATION_MILLISECONDS:-3600000}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"

volumes:
  ordertaker-postgres:
