spring:
  application:
    name: ordertaker
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-before-production}
  expiration-milliseconds: ${JWT_EXPIRATION_MILLISECONDS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
